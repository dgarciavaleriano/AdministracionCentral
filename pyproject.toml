[project]
name = "administracioncentral"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-alembic>=0.12.1",
]

# Para el analizador del editor (Pylance/Pyright). No lo lee ni alembic ni pytest:
# cada uno tiene su forma de saber que el codigo vive en src/, y sin esto el editor
# marca en rojo todos los `from config...` y `from storage...`.
[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
# Evita tener que exportar PYTHONPATH=src en cada comando.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "db: requiere una base de datos levantada",
]
