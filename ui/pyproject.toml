# El frontal es un proyecto uv independiente de la API: tiene sus propias
# dependencias (NiceGUI, requests) y su propio .venv. La raíz no declara
# `[tool.uv.workspace]`, así que `uv run` dentro de ui/ usa este proyecto.
#
#   cd ui
#   uv sync
#   uv run python main.py
[project]
name = "administracioncentral-ui"
version = "0.1.0"
description = "Frontal NiceGUI de Administración Central"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=2.27.0",
    # pydantic-settings arrastra python-dotenv: por eso no hace falta
    # declararlo aparte desde que ui/config/settings.py lee el .env.
    "pydantic-settings>=2.14.2",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
]

# Para el analizador del editor (Pylance/Pyright): los módulos del frontal se
# importan como `utils.constants` o `config.settings`, relativos a ui/.
[tool.pyright]
extraPaths = ["."]
