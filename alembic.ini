# Configuración de Alembic (generada con `alembic init migrations` y recortada).
# La URL de la base no va aquí: migrations/env.py la lee de src/config/settings.py.

[alembic]
script_location = %(here)s/migrations
# Para que env.py pueda importar config y storage, que viven en src/.
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
