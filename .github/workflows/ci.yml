name: Continuous Integration

on:
  pull_request:

jobs:
  Tester:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # La misma base de datos que el docker-compose, para los tests de la API.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: administracion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Falla si alguien cambió una tabla en src/storage/entities/ y no generó la migración.
      - name: Check for missing migrations
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest
