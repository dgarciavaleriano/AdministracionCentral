name: Continuous Integration

on:
  pull_request:

jobs:
  Tester:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: '3.14'

      - name: Install dependencies
        run: uv sync

      - name: Run tests and save exit code
        id: tests
        run: |
            mkdir -p test-results
            PYTHONPATH=src uv run pytest tests/ --capture=tee-sys > test-results/results.log
        continue-on-error: true
      
      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
