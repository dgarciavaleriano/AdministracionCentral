# docker compose up -d --wait     arrancar y esperar a que acepte conexiones
# docker compose down -v          parar y borrar los datos

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: administracion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d administracion"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Base desechable para tests: vive en RAM, no deja nada al parar.
  db_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: administracion_test
      # Subdirectorio: Postgres rechaza un tmpfs montado justo en PGDATA.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d administracion_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
