# docker compose up -d --wait db    solo la base de datos (para trabajar en local)
# docker compose up -d --wait       base de datos + API en contenedor
# docker compose down -v            parar y borrar los datos
#
# Las tablas las crean las migraciones. El contenedor de la API las aplica al
# arrancar; en local: uv run python -m alembic upgrade head

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: administracion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d administracion"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      # Dentro de Docker la base se llama `db`, no 127.0.0.1.
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/administracion
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
